opencollection: 1.0.0
name: Widget API
# Same 4-operation Widget API as Automated Tests/Importers/Postman,
# Automated Tests/Importers/Insomnia, and Automated Tests/Importers/OpenAPI —
# path params, query params, a JSON body, a multipart upload, bearer auth,
# and a before-request/tests script pair. Every request runs against
# httpbin.org for real. This is Bruno 3.0+'s single-file "Export Collection"
# output (OpenCollection format), not a classic per-file .bru folder — see
# Automated Tests/Importers/README.md for why.
items:
  - info:
      name: Widgets
      type: folder
      seq: 1
    items:
      - info:
          name: List Widgets
          type: http
          seq: 1
        http:
          method: GET
          url: "{{BASE_URL}}/get"
          auth:
            type: bearer
            token: "{{API_TOKEN}}"
          params:
            - name: page
              value: "1"
              type: query
            - name: limit
              value: "20"
              type: query

      - info:
          name: Get Widget
          type: http
          seq: 2
        http:
          method: GET
          url: "{{BASE_URL}}/anything/:id"
          auth:
            type: bearer
            token: "{{API_TOKEN}}"
          params:
            - name: id
              value: widget-42
              type: path

      - info:
          name: Create Widget
          type: http
          seq: 3
        http:
          method: POST
          url: "{{BASE_URL}}/post"
          auth:
            type: bearer
            token: "{{API_TOKEN}}"
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |
              {
                "name": "Widget Alpha",
                "price": 19.99
              }
        runtime:
          scripts:
            - type: before-request
              code: |
                req.setHeader("X-Request-Time", String(Date.now()));
                console.log("Sending create-widget request");
            - type: tests
              code: |
                test("Create widget succeeds", function () {
                    expect(res.status).to.eql(200);
                    expect(res.body.json).to.have.property("name");
                });

      - info:
          name: Upload Widget Asset
          type: http
          seq: 4
        http:
          method: POST
          url: "{{BASE_URL}}/post"
          auth:
            type: bearer
            token: "{{API_TOKEN}}"
          body:
            type: multipart-form
            data:
              - name: title
                value: Widget Photo
                type: text
              - name: asset
                value: assets/widget.png
                type: file
